# npm releases of @bounded-authority/client, started by pushing a v* tag. Publishing uses
# npm trusted publishing (GitHub Actions OIDC, no long-lived token) in two stages: this
# workflow stages the package with provenance (`npm stage publish`), and a maintainer
# approves the staged release on npmjs.com. The workflow cannot make a version live alone.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify the tagged tree (no publish credentials)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.20.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Full verification gate (typecheck, tests, mutations, package contents, vectors against dist/, docs against the installed tarball)
        run: pnpm typecheck && pnpm test && pnpm test:exhaustive && pnpm test:mutations && pnpm check:pack && pnpm check:dist && pnpm check:install

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Browser lanes (Chromium, Firefox, WebKit under the strict CSP)
        run: BAP_BROWSERS=chromium,firefox,webkit pnpm test:browser

  publish:
    name: Stage-publish to npm (provenance-bound; human approval required)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.20.0

      - name: Set up Node (24 bundles npm >= 11.5 — required for OIDC trusted publishing)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Exact pin (24.0.0 shipped npm 11.3, below the trusted-publishing floor;
          # a bare major would float the very constraint the lane depends on).
          node-version: 24.19.0
          cache: pnpm

      - name: Install (frozen lockfile, no install scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm build

      # Idempotent releases: a version already on the registry verifies only.
      - name: Verify registry for existing version
        id: existing
        run: |
          if npm view "@bounded-authority/client@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # A release is a v* tag on the commit that sets package.json's version. The
      # idempotency check above keys on the tag, while npm stage publish below publishes
      # package.json's version, so a mismatch would stage the wrong version: refuse it.
      - name: Tag must match package.json version
        run: |
          node --input-type=module -e "const tag = process.env.GITHUB_REF_NAME.replace(/^v/, ''); const pkg = (await import('./package.json', { with: { type: 'json' } })).default.version; if (pkg !== tag) { console.error(\`tag v\${tag} does not match package.json version \${pkg}\`); process.exit(1); } console.log(\`tag v\${tag} matches package.json \${pkg}\`);"

      - name: Stage publish to npm with provenance (human approval required)
        if: steps.existing.outputs.published == 'false'
        run: npm stage publish --provenance
