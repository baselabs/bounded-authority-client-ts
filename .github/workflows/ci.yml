name: CI

on:
  push:
    branches: [main]
    # A push that changes only Markdown no check reads does not run CI. Order matters: a later
    # pattern overrides an earlier one, so the Markdown the checks read (tools/checked-files.mjs:
    # docs samples and links, packed files) is included again. test/ci-paths.test.ts fails if a
    # checked file is excluded here.
    paths:
      - "**"
      - "!**/*.md"
      - "README.md"
      - "CHANGELOG.md"
      - "docs/**"
      - "test/browser/README.md"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Exact pins (a bare major would float): 22.23.1 is the .tool-versions pin and the
        # engines floor's lane; 24.19.0 is the current-LTS lane.
        node: [22.23.1, 24.19.0]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.20.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck (strict)
        run: pnpm typecheck

      - name: Test (vectors, byte pins, properties, refusals, guard)
        run: pnpm test

      - name: Every Unicode scalar value (exhaustive sweep, 1,112,064 values)
        run: pnpm test:exhaustive

      - name: Mutation red-proofs (every rule breaks a named test)
        run: pnpm test:mutations

      # A clean publish must ship code: npm pack runs prepack, which builds dist/, and the
      # reported file list must contain it. Then the vectors run against dist/ itself.
      - name: Package contents (prepack builds dist/; no source, tests, or maps)
        run: pnpm check:pack

      - name: Vectors against dist/ (the code a consumer receives)
        run: pnpm check:dist

      # The README's install path while the package is not on npm: pack, install the tarball into a
      # fresh project, typecheck and run the quickstart there.
      - name: README quickstart against the installed tarball
        run: pnpm check:install

  browser:
    # The vectors in real engines through Playwright under a strict CSP, with the client bundled by esbuild
    # for the browser (an engine axis, not an OS axis: Linux only). Linux WebKit is evidence for this
    # pure-JS code only, never for Safari.
    name: browser lane on ${{ matrix.engine }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.20.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1 # the .tool-versions pin
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install the ${{ matrix.engine }} build pinned by the locked Playwright
        run: pnpm exec playwright install --with-deps ${{ matrix.engine }}

      - name: Browser lane (vectors, wrong-backend and tampered-expectation red-proofs, CSP red-proof)
        env:
          BAP_BROWSERS: ${{ matrix.engine }}
        run: pnpm test:browser
