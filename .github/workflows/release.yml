# npm releases of @bounded-authority/client, started by pushing a v* tag. Publishing uses
# npm trusted publishing (GitHub Actions OIDC, no long-lived token) in two stages: this
# workflow stages the package with provenance (`npm stage publish`), and a maintainer
# approves the staged release on npmjs.com. The workflow cannot make a version live alone.
#
# The verify job packs the tarball it checked and uploads it; the publish job stages exactly that
# file. npm stage needs the package to exist on npm already, so the first version of a new
# package is published by a maintainer by hand.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify the tagged tree (no publish credentials)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.20.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Full verification gate (typecheck, tests, mutations, package contents, vectors against dist/, docs against the installed tarball)
        run: pnpm typecheck && pnpm test && pnpm test:exhaustive && pnpm test:mutations && pnpm check:pack && pnpm check:dist && pnpm check:install

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Browser lanes (Chromium, Firefox, WebKit under the strict CSP)
        run: BAP_BROWSERS=chromium,firefox,webkit pnpm test:browser

      # A release is a v* tag on the commit that sets package.json's version; refuse a mismatch
      # before anything is packed.
      - name: Tag must match package.json version
        run: |
          node --input-type=module -e "const tag = process.env.GITHUB_REF_NAME.replace(/^v/, ''); const pkg = (await import('./package.json', { with: { type: 'json' } })).default.version; if (pkg !== tag) { console.error(\`tag v\${tag} does not match package.json version \${pkg}\`); process.exit(1); } console.log(\`tag v\${tag} matches package.json \${pkg}\`);"

      - name: Pack the verified tree
        run: |
          mkdir release-tarball
          pnpm pack --pack-destination release-tarball
          sha256sum release-tarball/*.tgz

      - name: Upload the tarball for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-tarball
          path: release-tarball/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Stage-publish to npm (provenance-bound; human approval required)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node (24 bundles npm >= 11.5, required for OIDC trusted publishing)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Exact pin (24.0.0 shipped npm 11.3, below the trusted-publishing floor;
          # a bare major would float the very constraint the job depends on).
          node-version: 24.19.0

      - name: Download the tarball the verify job checked
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tarball
          path: release-tarball

      - name: The tarball's version must match the tag
        id: tarball
        run: |
          files=(release-tarball/*.tgz)
          if [ "${#files[@]}" -ne 1 ]; then echo "expected one tarball, found ${#files[@]}"; exit 1; fi
          sha256sum "${files[0]}"
          version=$(tar -xzOf "${files[0]}" package/package.json | node -e 'let s="";process.stdin.on("data",(d)=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')
          if [ "$version" != "${GITHUB_REF_NAME#v}" ]; then echo "tarball version $version does not match tag $GITHUB_REF_NAME"; exit 1; fi
          echo "file=${files[0]}" >> "$GITHUB_OUTPUT"

      # Idempotent releases: a version already published verifies only.
      - name: Check the registry for the version
        id: existing
        run: |
          if npm view "@bounded-authority/client@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # A staged version is not visible to npm view, and the short-lived trusted-publishing token
      # cannot run `npm stage list`. Staged and published versions share one version index, so
      # staging a version again is refused; that refusal means the version is already staged or
      # published, and the run succeeds with a notice. The refusal's exact wording has not been
      # observed for a staged version; the patterns match npm's "cannot publish over the
      # previously published versions" and an "already staged/exists" message.
      - name: Stage publish the tarball with provenance (human approval required)
        if: steps.existing.outputs.published == 'false'
        run: |
          set +e
          out=$(npm stage publish "${{ steps.tarball.outputs.file }}" --provenance 2>&1)
          status=$?
          echo "$out"
          if [ $status -ne 0 ] && echo "$out" | grep -Eiq 'cannot publish over|previously published|already (been )?staged|already exists'; then
            echo "::notice::${GITHUB_REF_NAME#v} is already staged or published; approve or reject the staged version on npmjs.com."
            exit 0
          fi
          exit $status
